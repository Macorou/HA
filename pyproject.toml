[project]
name = "smart-heat-manager"
version = "0.1.2"
description = "Home Assistant room heating, Tempo and photovoltaic orchestration"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
